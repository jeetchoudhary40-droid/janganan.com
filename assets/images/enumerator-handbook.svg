<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="enumGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b2545" />
      <stop offset="50%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#046A38" />
    </linearGradient>
    <linearGradient id="saffronGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF671F" />
      <stop offset="100%" stop-color="#FFA41B" />
    </linearGradient>
  </defs>
  
  <rect width="800" height="450" fill="url(#enumGrad)" />
  
  <!-- Handbook Graphic -->
  <g transform="translate(310, 45)">
    <!-- Shadow -->
    <rect x="8" y="10" width="180" height="250" rx="10" fill="#000000" opacity="0.4" />
    <rect width="180" height="250" rx="10" fill="#ffffff" />
    <rect x="0" y="0" width="22" height="250" rx="4" fill="url(#saffronGrad)" />
    
    <rect x="35" y="25" width="130" height="20" rx="4" fill="#046A38" />
    <text x="100" y="39" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">FIELD MANUAL</text>
    
    <rect x="35" y="60" width="130" height="6" rx="2" fill="#cbd5e1" />
    <rect x="35" y="75" width="110" height="6" rx="2" fill="#cbd5e1" />
    <rect x="35" y="90" width="120" height="6" rx="2" fill="#cbd5e1" />
    
    <circle cx="100" cy="155" r="34" fill="#0b2545" stroke="#FF671F" stroke-width="3" />
    <text x="100" y="162" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle">2026</text>
    
    <rect x="35" y="210" width="130" height="18" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" />
    <text x="100" y="223" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="bold" fill="#0b2545" text-anchor="middle">OFFICIAL GUIDE</text>
  </g>

  <!-- Title Badge -->
  <rect x="130" y="340" width="540" height="65" rx="10" fill="#ffffff" />
  <rect x="130" y="340" width="540" height="4" fill="url(#saffronGrad)" />
  <text x="400" y="368" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="800" fill="#0f2744" text-anchor="middle">
    ENUMERATOR &amp; SUPERVISOR HANDBOOK
  </text>
  <text x="400" y="390" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#FF671F" text-anchor="middle">
    प्रगणक एवं पर्यवेक्षक फील्ड नियमावली व मोबाइल ऐप गाइड
  </text>
</svg>
