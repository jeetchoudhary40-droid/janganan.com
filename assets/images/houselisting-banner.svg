<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="hlGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="60%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>
    <linearGradient id="saffronGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF671F" />
      <stop offset="100%" stop-color="#FFA41B" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#046A38" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
  </defs>
  
  <rect width="800" height="450" fill="url(#hlGrad)" />
  
  <!-- Geometric Decorative Elements -->
  <circle cx="700" cy="80" r="140" fill="#FF671F" opacity="0.12" />
  <circle cx="100" cy="380" r="180" fill="#046A38" opacity="0.12" />

  <!-- House Graphic -->
  <g transform="translate(180, 60)">
    <!-- Shadow -->
    <polygon points="120,25 15,95 225,95" fill="#000000" opacity="0.3" />
    <polygon points="120,20 20,90 220,90" fill="url(#saffronGrad)" />
    <rect x="40" y="90" width="160" height="130" fill="#ffffff" rx="6" />
    <rect x="60" y="110" width="40" height="40" rx="4" fill="#0284c7" />
    <rect x="140" y="110" width="40" height="40" rx="4" fill="#0284c7" />
    <rect x="95" y="150" width="50" height="70" rx="3" fill="#334155" />
    <circle cx="135" cy="185" r="3" fill="#FFD700" />
  </g>

  <!-- Questionnaire Checklist Document Graphic -->
  <g transform="translate(430, 45)">
    <!-- Card Shadow -->
    <rect x="5" y="8" width="220" height="260" rx="12" fill="#000000" opacity="0.35" />
    <rect width="220" height="260" rx="12" fill="#ffffff" />
    <rect x="20" y="20" width="180" height="20" rx="4" fill="url(#greenGrad)" />
    <text x="110" y="34" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">HOUSELISTING SCHEDULE</text>
    
    <rect x="20" y="55" width="18" height="18" rx="4" fill="#FF671F" />
    <path d="M 24 64 L 27 68 L 34 60" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="48" y="60" width="145" height="8" rx="3" fill="#cbd5e1" />
    
    <rect x="20" y="85" width="18" height="18" rx="4" fill="#FF671F" />
    <path d="M 24 94 L 27 98 L 34 90" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="48" y="90" width="125" height="8" rx="3" fill="#cbd5e1" />
    
    <rect x="20" y="115" width="18" height="18" rx="4" fill="#FF671F" />
    <path d="M 24 124 L 27 128 L 34 120" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="48" y="120" width="135" height="8" rx="3" fill="#cbd5e1" />

    <rect x="20" y="145" width="18" height="18" rx="4" fill="#FF671F" />
    <path d="M 24 154 L 27 158 L 34 150" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="48" y="150" width="150" height="8" rx="3" fill="#cbd5e1" />

    <rect x="20" y="180" width="180" height="38" rx="6" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1" />
    <text x="110" y="204" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold" fill="#046A38" text-anchor="middle">31 QUESTIONS LIST</text>
  </g>

  <!-- Title Badge -->
  <rect x="130" y="340" width="540" height="65" rx="10" fill="#ffffff" />
  <rect x="130" y="340" width="540" height="4" fill="url(#saffronGrad)" />
  <text x="400" y="368" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="800" fill="#0f2744" text-anchor="middle">
    PHASE 1: HOUSELISTING &amp; HOUSING CENSUS
  </text>
  <text x="400" y="390" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#046A38" text-anchor="middle">
    मकान सूचीकरण और आवास जनगणना (31 मानक प्रश्न)
  </text>
</svg>
