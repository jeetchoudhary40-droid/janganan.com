<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="hlGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="60%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>
  </defs>
  
  <rect width="800" height="450" fill="url(#hlGrad)" />
  
  <!-- Geometric Decorative Elements -->
  <circle cx="700" cy="80" r="140" fill="#FF671F" opacity="0.15" />
  <circle cx="100" cy="380" r="180" fill="#046A38" opacity="0.15" />

  <!-- House Graphic -->
  <g transform="translate(180, 70)">
    <polygon points="120,20 20,90 220,90" fill="#FF671F" />
    <rect x="40" y="90" width="160" height="130" fill="#ffffff" rx="4" />
    <rect x="60" y="110" width="40" height="40" rx="4" fill="#0284c7" />
    <rect x="140" y="110" width="40" height="40" rx="4" fill="#0284c7" />
    <rect x="95" y="150" width="50" height="70" rx="2" fill="#334155" />
  </g>

  <!-- Questionnaire Checklist Document Graphic -->
  <g transform="translate(420, 50)" filter="drop-shadow(0 15px 25px rgba(0,0,0,0.5))">
    <rect width="220" height="260" rx="10" fill="#ffffff" />
    <rect x="20" y="20" width="180" height="16" rx="4" fill="#046A38" />
    <rect x="20" y="55" width="16" height="16" rx="3" fill="#FF671F" />
    <rect x="45" y="59" width="140" height="8" rx="2" fill="#cbd5e1" />
    
    <rect x="20" y="85" width="16" height="16" rx="3" fill="#FF671F" />
    <rect x="45" y="89" width="110" height="8" rx="2" fill="#cbd5e1" />
    
    <rect x="20" y="115" width="16" height="16" rx="3" fill="#FF671F" />
    <rect x="45" y="119" width="130" height="8" rx="2" fill="#cbd5e1" />

    <rect x="20" y="145" width="16" height="16" rx="3" fill="#FF671F" />
    <rect x="45" y="149" width="150" height="8" rx="2" fill="#cbd5e1" />

    <rect x="20" y="180" width="180" height="35" rx="6" fill="#f1f5f9" />
    <text x="110" y="202" font-family="sans-serif" font-size="12" font-weight="bold" fill="#046A38" text-anchor="middle">31 QUESTIONS LIST</text>
  </g>

  <!-- Title Badge -->
  <rect x="150" y="340" width="500" height="60" rx="8" fill="rgba(255,255,255,0.95)" />
  <text x="400" y="365" font-family="sans-serif" font-size="18" font-weight="bold" fill="#0f2744" text-anchor="middle">
    PHASE 1: HOUSELISTING & HOUSING CENSUS
  </text>
  <text x="400" y="385" font-family="sans-serif" font-size="13" font-weight="600" fill="#046A38" text-anchor="middle">
    मकान सूचीकरण और आवास जनगणना (31 मानक प्रश्न)
  </text>
</svg>
