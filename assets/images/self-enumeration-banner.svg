<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f2744" />
      <stop offset="50%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#046A38" />
    </linearGradient>
    <linearGradient id="saffronGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF671F" />
      <stop offset="100%" stop-color="#FFA41B" />
    </linearGradient>
  </defs>
  
  <rect width="800" height="450" fill="url(#bgGrad)" />
  
  <!-- Subtle Grid Pattern -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="90" x2="800" y2="90" />
    <line x1="0" y1="180" x2="800" y2="180" />
    <line x1="0" y1="270" x2="800" y2="270" />
    <line x1="0" y1="360" x2="800" y2="360" />
    <line x1="160" y1="0" x2="160" y2="450" />
    <line x1="320" y1="0" x2="320" y2="450" />
    <line x1="480" y1="0" x2="480" y2="450" />
    <line x1="640" y1="0" x2="640" y2="450" />
  </g>

  <!-- Laptop / Screen Card -->
  <rect x="255" y="75" width="300" height="200" rx="12" fill="#000000" opacity="0.35" />
  <rect x="250" y="70" width="300" height="200" rx="12" fill="#ffffff" />
  <rect x="260" y="80" width="280" height="150" rx="6" fill="#f8fafc" />
  
  <!-- Form Mockup on Screen -->
  <rect x="280" y="100" width="140" height="12" rx="4" fill="url(#saffronGrad)" />
  <rect x="280" y="125" width="240" height="8" rx="2" fill="#cbd5e1" />
  <rect x="280" y="145" width="200" height="8" rx="2" fill="#cbd5e1" />
  <rect x="280" y="165" width="110" height="24" rx="4" fill="#046A38" />
  <rect x="400" y="165" width="120" height="24" rx="4" fill="#e2e8f0" />
  
  <!-- Laptop Stand -->
  <path d="M 350 270 L 450 270 L 470 290 L 330 290 Z" fill="#94a3b8" />

  <!-- Mobile Phone Mockup -->
  <rect x="165" y="145" width="110" height="210" rx="16" fill="#000000" opacity="0.4" />
  <rect x="160" y="140" width="110" height="210" rx="16" fill="#0f172a" stroke="#cbd5e1" stroke-width="2" />
  <rect x="170" y="160" width="90" height="160" rx="8" fill="#ffffff" />
  <circle cx="215" cy="150" r="3" fill="#64748b" />
  
  <!-- OTP Verification Simulation on Mobile -->
  <text x="215" y="190" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="bold" fill="#1e293b" text-anchor="middle">OTP VERIFY</text>
  <rect x="180" y="210" width="70" height="14" rx="3" fill="#e0f2fe" />
  <text x="215" y="221" font-family="monospace" font-size="10" fill="#0369a1" text-anchor="middle">● ● ● ● ● ●</text>
  <rect x="180" y="240" width="70" height="18" rx="4" fill="#FF671F" />
  <text x="215" y="253" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="bold" fill="#ffffff" text-anchor="middle">CONFIRM</text>

  <!-- Title Badge -->
  <rect x="130" y="340" width="540" height="65" rx="10" fill="#ffffff" />
  <rect x="130" y="340" width="540" height="4" fill="url(#saffronGrad)" />
  <text x="400" y="368" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="800" fill="#0f2744" text-anchor="middle">
    ONLINE SELF-ENUMERATION PORTAL
  </text>
  <text x="400" y="390" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#FF671F" text-anchor="middle">
    डिजिटल जनगणना स्व-गणना मार्गदर्शिका
  </text>
</svg>
