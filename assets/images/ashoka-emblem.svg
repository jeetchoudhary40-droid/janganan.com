<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Circular Golden Base -->
  <circle cx="50" cy="50" r="46" fill="#0B2545" stroke="#FF671F" stroke-width="3"/>
  <circle cx="50" cy="50" r="38" fill="none" stroke="#FFD700" stroke-width="1.5" stroke-dasharray="3,2"/>
  
  <!-- Ashoka Chakra 24 Spoke Center Motif -->
  <circle cx="50" cy="50" r="22" fill="#FFFFFF" stroke="#06038D" stroke-width="2"/>
  <circle cx="50" cy="50" r="4" fill="#06038D"/>
  
  <!-- 24 Spokes -->
  <g stroke="#06038D" stroke-width="1.2">
    <line x1="50" y1="28" x2="50" y2="72" />
    <line x1="28" y1="50" x2="72" y2="50" />
    <line x1="34.4" y1="34.4" x2="65.6" y2="65.6" />
    <line x1="34.4" y1="65.6" x2="65.6" y2="34.4" />
    <line x1="40.7" y1="29.7" x2="59.3" y2="70.3" />
    <line x1="29.7" y1="40.7" x2="70.3" y2="59.3" />
    <line x1="40.7" y1="70.3" x2="59.3" y2="29.7" />
    <line x1="29.7" y1="59.3" x2="70.3" y2="40.7" />
    <line x1="45.3" y1="28.3" x2="54.7" y2="71.7" />
    <line x1="28.3" y1="45.3" x2="71.7" y2="54.7" />
    <line x1="45.3" y1="71.7" x2="54.7" y2="28.3" />
    <line x1="28.3" y1="54.7" x2="71.7" y2="45.3" />
  </g>

  <!-- Tricolor Trim -->
  <path d="M 20 84 Q 50 94 80 84" fill="none" stroke="#046A38" stroke-width="3" stroke-linecap="round"/>
  <path d="M 20 16 Q 50 6 80 16" fill="none" stroke="#FF671F" stroke-width="3" stroke-linecap="round"/>
</svg>
