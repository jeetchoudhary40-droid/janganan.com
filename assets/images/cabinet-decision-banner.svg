<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="cabGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06038D" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="saffronGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF671F" />
      <stop offset="100%" stop-color="#FFA41B" />
    </linearGradient>
  </defs>
  
  <rect width="800" height="450" fill="url(#cabGrad)" />
  <circle cx="400" cy="170" r="130" fill="none" stroke="#FF671F" stroke-width="2" stroke-dasharray="6,4" />
  
  <!-- Gazette Seal Graphic -->
  <circle cx="405" cy="175" r="85" fill="#000000" opacity="0.35" />
  <circle cx="400" cy="170" r="85" fill="#ffffff" />
  <circle cx="400" cy="170" r="72" fill="none" stroke="#046A38" stroke-width="3" />
  <circle cx="400" cy="170" r="66" fill="none" stroke="#FF671F" stroke-width="1.5" />
  
  <text x="400" y="150" font-family="Georgia, serif" font-size="14" font-weight="bold" fill="#0B2545" text-anchor="middle">THE GAZETTE</text>
  <text x="400" y="172" font-family="Georgia, serif" font-size="12" font-weight="bold" fill="#FF671F" text-anchor="middle">OF INDIA</text>
  <text x="400" y="195" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="bold" fill="#046A38" text-anchor="middle">EXTRAORDINARY</text>

  <!-- Title Badge -->
  <rect x="130" y="340" width="540" height="65" rx="10" fill="#ffffff" />
  <rect x="130" y="340" width="540" height="4" fill="url(#saffronGrad)" />
  <text x="400" y="368" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="800" fill="#0f2744" text-anchor="middle">
    OFFICIAL GAZETTE &amp; NOTIFICATIONS
  </text>
  <text x="400" y="390" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#06038D" text-anchor="middle">
    डिजिटल जनगणना ढांचा और केंद्रीय मंत्रिमंडल अधिसूचना
  </text>
</svg>
